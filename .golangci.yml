version: "2"

linters:
  enable:
    - depguard
    - forbidigo
    - staticcheck
    - errcheck
    - govet
    - ineffassign
  settings:
    depguard:
      rules:
        cli-boundary:
          files:
            - "cmd/cli/**"
          deny:
            - pkg: "github.com/runtime-terror404/piomx/internal/core"
              desc: "cmd/cli must go through internal/actions"
            - pkg: "github.com/runtime-terror404/piomx/internal/ioc"
              desc: "cmd/cli must go through internal/actions"
            - pkg: "github.com/runtime-terror404/piomx/internal/generate"
              desc: "cmd/cli must go through internal/actions"
            - pkg: "github.com/runtime-terror404/piomx/internal/writer"
              desc: "cmd/cli must go through internal/actions"
            - pkg: "github.com/runtime-terror404/piomx/internal/lockfile"
              desc: "cmd/cli must go through internal/actions"
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: "Use cmd/cli-level printing; actions must return data"
  exclusions:
    rules:
      - path: cmd/cli/
        linters:
          - forbidigo
        text: "Use cmd/cli-level printing"

formatters:
  enable:
    - gofumpt
