# Goreleaser configuration for piomx.
# Triggered by: git tag vX.Y.Z && git push --tags

version: 1

builds:
  - id: piomx
    main: ./cmd/cli
    binary: piomx
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "piomx_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
  footer: |
    **Install**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/runtime-terror404/piomx/main/install.sh | sh
    ```

changelog:
  sort: asc
  filters:
    exclude:
      - Merge pull request
      - Merge branch
